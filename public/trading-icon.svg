<svg xmlns="http://www.w3.org/2000/svg" width="200" height="200" viewBox="0 0 200 200">
  <!-- Three candlesticks -->
  <!-- Candle 1 - small dark/bearish -->
  <line x1="60" y1="72" x2="60" y2="120" stroke="#1b3a5c" stroke-width="3"/>
  <rect x="52" y="82" width="16" height="24" fill="#1b3a5c" rx="1"/>
  <!-- Candle 2 - medium green/bullish -->
  <line x1="100" y1="55" x2="100" y2="118" stroke="#059669" stroke-width="3"/>
  <rect x="90" y="62" width="20" height="38" fill="#059669" rx="1"/>
  <!-- Candle 3 - large dark/bearish -->
  <line x1="140" y1="42" x2="140" y2="108" stroke="#1b3a5c" stroke-width="3"/>
  <rect x="130" y="48" width="20" height="40" fill="#1b3a5c" rx="1"/>
  <!-- Uptrend line with arrow -->
  <polyline points="38,82 68,68 108,58 148,38" stroke="#059669" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <polygon points="148,38 138,36 142,46" fill="#059669"/>
  <!-- Network/agent lines at bottom connecting candles -->
  <circle cx="60" cy="140" r="5" fill="none" stroke="#1b3a5c" stroke-width="3"/>
  <circle cx="140" cy="140" r="5" fill="none" stroke="#1b3a5c" stroke-width="3"/>
  <line x1="65" y1="140" x2="90" y2="140" stroke="#1b3a5c" stroke-width="3"/>
  <line x1="110" y1="140" x2="135" y2="140" stroke="#1b3a5c" stroke-width="3"/>
  <line x1="90" y1="140" x2="100" y2="155" stroke="#1b3a5c" stroke-width="3"/>
  <line x1="110" y1="140" x2="100" y2="155" stroke="#1b3a5c" stroke-width="3"/>
  <circle cx="100" cy="155" r="5" fill="none" stroke="#1b3a5c" stroke-width="3"/>
</svg>
